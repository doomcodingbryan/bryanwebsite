<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Chae Portfolio · Contact</title>
    <meta name="description" content="Get in touch with Bryan Chae.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css?v=48">
    <script>
        // the loading screen plays once per visit, not on every navigation
        try {
            if (sessionStorage.seenLoader) document.documentElement.classList.add('no-loader');
            sessionStorage.seenLoader = 1;
        } catch (e) { /* storage blocked: just show it */ }
    </script>
</head>

<body>
    <div class="loader" id="loader" aria-hidden="true">
        <div class="load-box">
            <div class="load-barwrap">
                <div class="load-bubble"></div>
                <div class="load-track">
                    <div class="load-fill" id="loadFill"></div>
                </div>
            </div>
            <div class="load-title">Loading</div>
            <div class="load-sub">Please Wait...</div>
        </div>
    </div>
    <div class="aside">
        <div>
            <a href="index.html" class="brand">
                <h1>B.Chae Portfolio</h1>
            </a>
            <div class="aside-sub">
                <h2>What I've been up to</h2>
                <p>&copy; 2026</p>
            </div>
        </div>
        <nav class="menu" aria-label="Primary">
            <a href="index.html" class="pill pill-folder">Works</a>
            <a href="about.html" class="pill">About</a>
            <a href="connect.html" class="pill active">Contact</a>
        </nav>
    </div>

    <main class="content">
        <section>
            <h2 class="section-label">Contact</h2>
            <div class="par">
                <p>The best way to stay in touch is on LinkedIn, or email me if you're old fashioned.</p>
            </div>
            <ul class="contact-links">
                <li><a class="linkedin" href="https://www.linkedin.com/in/bryan-chae-850597245/" target="_blank"
                        rel="noopener">LinkedIn <span class="val">/in/bryan-chae ↗</span></a></li>
                <li><a class="email" href="mailto:byc27@cornell.edu">Email <span
                            class="val">byc27@cornell.edu</span></a></li>
                <li><a class="resume" href="links/Bryan_Chae_Resume.pdf" target="_blank" rel="noopener">Resume <span
                            class="val">Download PDF ↓</span></a></li>
            </ul>
        </section>
    </main>
    <script>
        // reveal once the page is loaded AND the bar has finished filling,
        // so the progress never vanishes mid-sweep. Duration is read from
        // --fill-dur (seconds) so the CSS stays the single source of truth.
        const fillMs = parseFloat(
            getComputedStyle(loader).getPropertyValue('--fill-dur')) * 1000;
        Promise.all([
            document.readyState === 'complete'
                ? Promise.resolve()
                : new Promise(r => addEventListener('load', r)),
            new Promise(r => setTimeout(r, fillMs))
        ]).then(() => loader.classList.add('done'));
    </script>
</body>

</html>
